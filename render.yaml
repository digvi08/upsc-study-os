# Render Blueprint — free tier backend
# Deploy: https://dashboard.render.com → New → Blueprint → connect repo
services:
  - type: web
    name: upsc-study-os-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: OPENAI_API_KEY
        sync: false
    # Migrations + server run via backend/start.sh (Dockerfile CMD)
